name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run knowledge:check
      - run: npm run lint
      - run: npm run build

  validate_ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy_ai:
    if: github.event_name != 'pull_request' && vars.AI_ASSISTANT_ENABLED == 'true'
    needs: validate_ai
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run knowledge:check:strict
      - name: Install AI worker dependencies
        working-directory: ai-worker
        run: npm ci
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ai-worker
          command: d1 migrations apply luxudong-ai --remote
      - name: Deploy AI worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ai-worker
          command: deploy
          secrets: |
            TURNSTILE_SECRET_KEY
            REINDEX_SECRET
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          REINDEX_SECRET: ${{ secrets.AI_REINDEX_SECRET }}
      - name: Refresh knowledge index
        env:
          AI_API_URL: ${{ vars.AI_API_URL }}
          REINDEX_SECRET: ${{ secrets.AI_REINDEX_SECRET }}
        run: >
          curl --fail-with-body
          -X POST "$AI_API_URL/internal/reindex"
          -H "Authorization: Bearer $REINDEX_SECRET"
      - name: Verify AI service readiness
        env:
          AI_API_URL: ${{ vars.AI_API_URL }}
        run: |
          curl --fail-with-body "$AI_API_URL/health"
          curl --fail-with-body "$AI_API_URL/v1/meta" -o /tmp/ai-meta.json
          node -e "const m=require('/tmp/ai-meta.json');if(!m.ready)process.exit(1)"

  image:
    if: >-
      github.event_name != 'pull_request' &&
      always() &&
      needs.validate.result == 'success' &&
      needs.validate_ai.result == 'success' &&
      (needs.deploy_ai.result == 'success' || needs.deploy_ai.result == 'skipped')
    needs: [validate, validate_ai, deploy_ai]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_CMS_URL=https://cms.luxudong.me
            VITE_AI_ASSISTANT_ENABLED=${{ vars.AI_ASSISTANT_ENABLED || 'false' }}
            VITE_AI_API_URL=${{ vars.AI_API_URL }}
            VITE_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
          tags: |
            ghcr.io/lxdll/luxudong-web:sha-${{ github.sha }}
            ghcr.io/lxdll/luxudong-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy immutable image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ needs.image.outputs.tag }}
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo /usr/local/sbin/luxudong-deploy '$IMAGE_TAG'"
