name: luxudong

x-logging: &default-logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      directus:
        condition: service_healthy
    networks:
      - edge
    logging: *default-logging

  web:
    image: ghcr.io/lxdll/luxudong-web:${WEB_IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging

  directus:
    image: directus/directus:11.17.4
    restart: unless-stopped
    expose:
      - "8055"
    depends_on:
      database:
        condition: service_healthy
    environment:
      SECRET: ${DIRECTUS_SECRET}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      PUBLIC_URL: https://cms.luxudong.me
      CORS_ENABLED: "true"
      CORS_ORIGIN: https://luxudong.me
      CORS_CREDENTIALS: "false"
      WEBSOCKETS_ENABLED: "false"
      RATE_LIMITER_ENABLED: "true"
      RATE_LIMITER_POINTS: "50"
      RATE_LIMITER_DURATION: "1"
      ASSETS_CACHE_TTL: 7d
      ASSETS_TRANSFORM_IMAGE_MAX_DIMENSION: "4096"
      TELEMETRY: "false"
    volumes:
      - directus_uploads:/directus/uploads
      - ./directus:/project
    networks:
      - edge
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8055/server/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging: *default-logging

  database:
    image: postgres:17.7-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

networks:
  edge:
  internal:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  directus_uploads:
  postgres_data:
